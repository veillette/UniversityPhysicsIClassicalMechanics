name: Deploy MyST to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: QuadriviumPress/bindery/.github/workflows/deploy.yml@main
    with:
      pre-build-command: npm run verify
      build-command: npm run build
      output-dir: _build/html
